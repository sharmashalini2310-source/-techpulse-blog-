<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | TechPulse</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body>
<div id="nav"></div>
<header class="site-header"><div class="container"><h1 class="display-6">Create your account</h1><p class="mb-0">Join TechPulse to save articles and comment.</p></div></header>
<main class="container"><div class="panel auth-card w-100"><h2 class="h5 text-center mb-3"><i class="bi bi-person-plus"></i> Reader registration</h2><div id="msg"></div>
<form id="f" class="row g-3"><div class="col-sm-6"><label class="form-label" for="name">Full name *</label><input id="name" class="form-control" required></div>
<div class="col-sm-6"><label class="form-label" for="enrollment">Enrollment number</label><input id="enrollment" class="form-control"></div>
<div class="col-sm-6"><label class="form-label" for="email">Email *</label><input id="email" type="email" class="form-control" required></div>
<div class="col-sm-6"><label class="form-label" for="mobile">Mobile</label><input id="mobile" pattern="[0-9]{10}" class="form-control" placeholder="10 digits"></div>
<div class="col-sm-6"><label class="form-label" for="department">Department</label><select id="department" class="form-select"><option>Computer Engineering</option><option>Information Technology</option><option>Computer Science & Engineering</option><option>Electronics & Communication</option><option>Other</option></select></div>
<div class="col-sm-6"><label class="form-label" for="semester">Semester</label><select id="semester" class="form-select"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
<div class="col-sm-6"><label class="form-label" for="password">Password *</label><input id="password" type="password" minlength="8" class="form-control" required></div>
<div class="col-sm-6"><label class="form-label" for="cpass">Confirm password *</label><input id="cpass" type="password" class="form-control" required></div>
<div class="col-12 form-check ms-2"><input type="checkbox" class="form-check-input" id="sp"><label class="form-check-label" for="sp">Show passwords</label></div>
<div class="col-12"><button class="btn btn-teal w-100">Create account</button></div></form>
<p class="text-center small mt-3 mb-0">Already registered? <a href="login.html">Log in</a></p></div></main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>renderNav('reg');renderFooter();
sp.onchange=()=>{password.type=cpass.type=sp.checked?'text':'password'};
f.onsubmit=async e=>{e.preventDefault();if(password.value!==cpass.value)return alertBox(msg,'Passwords do not match.','danger');
 try{const b={};['name','enrollment','email','mobile','department','semester','password'].forEach(k=>b[k]=document.getElementById(k).value);
 const r=await api('/auth/register','POST',b);alertBox(msg,r.message+' Redirecting to login...');setTimeout(()=>location.href='login.html',1200)}catch(x){alertBox(msg,x.message,'danger')}};</script></body></html>
