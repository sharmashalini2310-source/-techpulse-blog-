<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article | TechPulse</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body>
<div id="nav"></div>

<header class="site-header"><div class="container"><span class="badge-cat" id="pc"></span><h1 class="display-6 mt-2" id="pt">Loading...</h1><p class="mb-0" id="pm"></p></div></header>
<main class="container mt-4"><div class="row g-4"><section class="col-lg-8">
 <article class="panel"><div class="d-flex justify-content-between align-items-center mb-3"><a href="blog.html"><i class="bi bi-arrow-left"></i> All articles</a><button id="saveBtn" class="btn btn-sm btn-outline-secondary"><i class="bi bi-bookmark"></i> Save</button></div>
  <div class="article" id="body"></div><div id="tags" class="mt-4"></div></article>
 <section class="panel mt-4"><h2 class="h5">Comments</h2><div id="cmsg"></div>
  <form id="cf" class="mb-3"><label class="form-label" for="ct">Add your comment</label><textarea id="ct" class="form-control" rows="3" maxlength="600" required></textarea><button class="btn btn-teal mt-2">Post comment</button></form><div id="clist"></div></section>
 </section><aside class="col-lg-4"><div id="sidebar"></div></aside></div></main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>layout('blog');const id=new URLSearchParams(location.search).get('id');
(async()=>{try{const p=await api('/posts/'+id);document.title=p.title+' | TechPulse';
 pc.textContent=p.category;pt.textContent=p.title;pm.innerHTML=`${esc(p.author)} &middot; ${fmt(p.createdAt)} &middot; ${p.readMinutes} min read &middot; ${p.views} views`;
 body.innerHTML=renderContent(p.content);tags.innerHTML=p.tags.map(t=>`<span class="badge text-bg-light me-1">#${esc(t)}</span>`).join('');loadC()}
 catch(e){pt.textContent='Article not found';body.innerHTML='<p>'+esc(e.message)+'</p>'}})();
async function loadC(){const c=await api('/posts/'+id+'/comments');clist.innerHTML=c.map(x=>`<div class="border-top py-2"><b>${esc(x.userName)}</b> <span class="meta">${fmt(x.createdAt)}</span><p class="mb-0">${esc(x.text)}</p></div>`).join('')||'<p class="text-muted mb-0">No comments yet. Be the first to share a thought.</p>'}
cf.onsubmit=async e=>{e.preventDefault();if(!token()){location.href='login.html';return}
 try{const r=await api('/posts/'+id+'/comments','POST',{text:ct.value});alertBox(cmsg,r.message);ct.value=''}catch(x){alertBox(cmsg,x.message,'danger')}};
saveBtn.onclick=async()=>{if(!token()){location.href='login.html';return}
 try{const r=await api('/posts/'+id+'/save','POST');saveBtn.innerHTML=`<i class="bi bi-bookmark${r.saved?'-fill':''}"></i> ${r.saved?'Saved':'Save'}`;alertBox(cmsg,r.message)}catch(x){alertBox(cmsg,x.message,'danger')}};</script></body></html>
