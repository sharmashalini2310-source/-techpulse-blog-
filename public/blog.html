<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Articles | TechPulse</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body>
<div id="nav"></div>
<header class="site-header"><div class="container"><h1 class="display-6">Technology articles</h1><p class="mb-0">Search by keyword or filter by topic.</p></div></header>
<main class="container mt-4"><div class="row g-4"><section class="col-lg-8">
 <div class="panel mb-4"><div class="row g-2"><div class="col-md-7"><label class="form-label" for="q">Search</label><input id="q" class="form-control" placeholder="Title, topic or tag"></div>
 <div class="col-md-5"><label class="form-label" for="cat">Category</label><select id="cat" class="form-select"><option value="">All categories</option></select></div></div></div>
 <div class="d-flex justify-content-between mb-2"><h2 class="h5">Available articles</h2><span id="count" class="meta"></span></div>
 <div class="row g-4" id="list"></div></section><aside class="col-lg-4"><div id="sidebar"></div></aside></div></main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>layout('blog');
const p=new URLSearchParams(location.search),q=document.getElementById('q'),cat=document.getElementById('cat');q.value=p.get('q')||'';
Object.keys(CAT).forEach(c=>cat.insertAdjacentHTML('beforeend',`<option>${c}</option>`));cat.value=p.get('category')||'';
async function load(){try{const d=await api('/posts?q='+encodeURIComponent(q.value)+'&category='+encodeURIComponent(cat.value));
 document.getElementById('count').textContent=d.length+' article'+(d.length==1?'':'s');
 document.getElementById('list').innerHTML=d.map(postCard).join('')||'<div class="text-center text-muted py-5"><i class="bi bi-search fs-1"></i><p>No articles match. Try another keyword or category.</p></div>'}catch(e){document.getElementById('list').innerHTML='<div class="alert alert-warning">'+esc(e.message)+'</div>'}}
let t;q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(load,300)});cat.addEventListener('change',load);load();</script></body></html>
