<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | TechPulse</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body>
<div id="nav"></div>

<header class="site-header"><div class="container"><small>READER PORTAL</small><h1 class="display-6" id="wel">Welcome</h1><p class="mb-0">Your saved articles and comments in one place.</p></div></header>
<main class="container mt-4"><div class="row g-3 mb-4"><div class="col-sm-6"><div class="stat"><i class="bi bi-bookmark-heart"></i><div><b id="n1">0</b>Saved articles</div></div></div>
<div class="col-sm-6"><div class="stat"><i class="bi bi-chat-dots"></i><div><b id="n2">0</b>My comments</div></div></div></div>
<div class="mb-4"><a class="btn btn-teal me-2" href="blog.html">Explore articles</a><a class="btn btn-outline-secondary" href="profile.html">My profile</a></div>
<div class="row g-4"><div class="col-md-6"><div class="panel"><h2 class="h6">Saved articles</h2><ul class="list-unstyled mb-0" id="sv"></ul></div></div>
<div class="col-md-6"><div class="panel"><h2 class="h6">My comments</h2><div id="cm"></div></div></div></div><div class="panel mt-4"><h2 class="h6">Latest announcements</h2><div id="an"></div></div></main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">if(u)api('/announcements').then(a=>{an.innerHTML=a.map(x=>`<div class="border-bottom py-2"><b>${esc(x.title)}</b><div class="small">${esc(x.message)}</div><div class="meta">${fmt(x.createdAt)}</div></div>`).join('')||'<p class="text-muted mb-0">No announcements.</p>'});
</script>
<script src="js/app.js"></script>
<script>const u=guard('reader');renderNav('dash');renderFooter();if(u){wel.textContent='Welcome, '+u.name+'!';
api('/me/dashboard').then(d=>{n1.textContent=d.saved.length;n2.textContent=d.comments.length;
 sv.innerHTML=d.saved.map(p=>`<li class="py-1"><a href="post.html?id=${p._id}">${esc(p.title)}</a></li>`).join('')||'<li class="text-muted">Nothing saved yet.</li>';
 const bc={approved:'success',pending:'warning',rejected:'danger'};
 cm.innerHTML=d.comments.map(c=>`<div class="d-flex justify-content-between border-bottom py-2"><div><b>${esc(c.post?c.post.title:'Removed article')}</b><div class="small">${esc(c.text)}</div></div><span class="badge text-bg-${bc[c.status]} align-self-start">${c.status}</span></div>`).join('')||'<p class="text-muted mb-0">No comments yet.</p>'}).catch(()=>logout())}</script></body></html>
