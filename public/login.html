<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | TechPulse</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body>
<div id="nav"></div>

<main class="container"><div class="panel auth-card w-100"><div class="text-center"><i class="bi bi-person-lock fs-1 text-success"></i><h2 class="h4" id="ttl">Reader Login</h2><p class="text-muted small">Sign in to access your TechPulse account.</p></div>
<div id="msg"></div><form id="f"><label class="form-label" for="email">Email address</label><input id="email" type="email" class="form-control mb-3" required>
<label class="form-label" for="password">Password</label><div class="input-group mb-3"><input id="password" type="password" class="form-control" required><button type="button" class="btn btn-outline-secondary" id="eye" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
<button class="btn btn-teal w-100">Log in</button></form>
<p class="text-center small mt-3 mb-1" id="l1">New here? <a href="register.html">Register</a></p><p class="text-center small mb-0" id="l2">Are you an administrator? <a href="login.html?role=admin">Admin login</a></p></div></main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>renderNav('');renderFooter();const role=new URLSearchParams(location.search).get('role')==='admin'?'admin':'reader';
if(role==='admin'){ttl.textContent='Admin Login';l1.style.display='none';l2.innerHTML='Reader? <a href="login.html">Reader login</a>'}
eye.onclick=()=>password.type=password.type==='password'?'text':'password';
f.onsubmit=async e=>{e.preventDefault();try{const r=await api('/auth/login','POST',{email:email.value,password:password.value,role});
 localStorage.setItem('tp_token',r.token);localStorage.setItem('tp_user',JSON.stringify(r.user));alertBox(msg,'Login successful! Redirecting...');
 setTimeout(()=>location.href=r.user.role==='admin'?'admin.html':'dashboard.html',700)}catch(x){alertBox(msg,x.message,'danger')}};</script></body></html>
